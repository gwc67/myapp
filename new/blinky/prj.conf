CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_DEBUG=y


######  OLED #####
#SSD1306

#enable I2c
CONFIG_I2C=y

#enable SSD1306 display
CONFIG_SSD1306=y

#enable display subsystem
CONFIG_DISPLAY=y

#cfb 字符帧缓冲(提供 cfb_* API)
CONFIG_CHARACTER_FRAMEBUFFER=y

# 禁用内置默认字体，只用自己的
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n

#cfb 内部用 k_malloc 分配帧缓冲，需要内核堆
CONFIG_HEAP_MEM_POOL_SIZE=2048

##### OLED #####



#如果使用lvgl
#CONFIG_LVGL=y

#按键 Input Subsystem(可选)

CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

#shell(i2c scan调试)
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y